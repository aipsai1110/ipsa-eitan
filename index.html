<style>
/* Layout: one-screen phone app — fixed header strip, scrolling body, thumb-zone actions at the bottom */
:root{
  --bg:#f6f7f4; --surface:#ffffff; --ink:#1d2433; --muted:#5d6676; --line:#dfe3dc;
  --ai:#24407a;         /* 藍 accent */
  --ai-soft:#e6ecf7;
  --lv1:#3f8a4f; --lv1-soft:#e7f2e8;   /* 基礎 */
  --lv2:#24407a; --lv2-soft:#e6ecf7;   /* 標準 */
  --lv3:#b4542a; --lv3-soft:#f8ebe3;   /* 発展 */
  --ok:#2e8a4a; --good:#2f62b8; --warn:#b07a12; --bad:#c03a32;
  --font-ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-word:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161f; --surface:#1b212d; --ink:#e8ebf2; --muted:#a0a8b8; --line:#2c3443;
  --ai:#8fb0f0; --ai-soft:#22304a;
  --lv1:#7cc58a; --lv1-soft:#1d2f22; --lv2:#8fb0f0; --lv2-soft:#22304a; --lv3:#ef9a6f; --lv3-soft:#3a261c;
  --ok:#6fcf8a; --good:#8fb0f0; --warn:#e3b44f; --bad:#f07f76; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161f; --surface:#1b212d; --ink:#e8ebf2; --muted:#a0a8b8; --line:#2c3443;
  --ai:#8fb0f0; --ai-soft:#22304a;
  --lv1:#7cc58a; --lv1-soft:#1d2f22; --lv2:#8fb0f0; --lv2-soft:#22304a; --lv3:#ef9a6f; --lv3-soft:#3a261c;
  --ok:#6fcf8a; --good:#8fb0f0; --warn:#e3b44f; --bad:#f07f76; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:10px 16px;min-height:52px;border-bottom:1px solid var(--line)}
.bar h2{flex:1;margin:0;font-size:16px;font-weight:700;text-align:center}
.icon-btn{width:40px;height:40px;border:0;background:transparent;border-radius:10px;font-size:20px;cursor:pointer;display:grid;place-items:center}
.icon-btn:focus-visible,.btn:focus-visible,.grow:focus-visible,.chip:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.scroll>*{flex-shrink:0}
.btn{border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;width:100%}
.btn.primary{background:var(--ai);color:var(--surface)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn:active{transform:scale(.98)}

/* top */
.top-head{padding:28px 20px 8px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.top-head h1{margin:0;font-size:30px;line-height:1.25;text-wrap:balance}
.top-head h1 span{font-family:var(--font-word);font-weight:700;color:var(--lv3);margin-right:.12em}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:56px;height:56px;border-radius:14px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.meta{color:var(--muted);font-size:13px}
.next-card{margin:16px 20px 0;padding:14px 16px;border-radius:14px;background:var(--soft);border:1px solid var(--c);display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.next-card .gbig{font-family:var(--font-word);font-size:40px;font-weight:700;line-height:1;color:var(--c);grid-row:span 2}
.next-card b{font-size:15px}
.next-card span{font-size:12px;color:var(--muted)}
.next-btns{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.next-btns .btn{padding:10px;font-size:14px}
.top-actions{padding:8px 20px 24px;display:flex;flex-direction:column;gap:12px;margin-top:auto}
.big-choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big-choice .btn{padding:28px 12px;font-size:20px;display:flex;flex-direction:column;align-items:center;gap:4px}
.big-choice .btn small{font-size:12px;font-weight:500;opacity:.85}
.btn.learn{background:var(--lv1);color:var(--surface)}
.btn.chal{background:var(--ai);color:var(--surface)}
.summary{margin:8px 20px 0;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:4px}
.summary b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.summary span{font-size:12px;color:var(--muted)}
.lvbar{margin:12px 20px 0;display:flex;flex-direction:column;gap:8px}
.lvbar .row{display:grid;grid-template-columns:44px 1fr 64px;gap:8px;align-items:center;font-size:13px}
.track{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%}
.num{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}

/* group list */
.level{border:2px solid var(--c);border-radius:16px;background:var(--surface);overflow:hidden}
.level>header{background:var(--soft);color:var(--c);padding:10px 14px;display:flex;align-items:baseline;gap:10px}
.level>header b{font-size:17px}
.level>header span{font-size:12px;color:var(--muted)}
.lv1{--c:var(--lv1);--soft:var(--lv1-soft)} .lv2{--c:var(--lv2);--soft:var(--lv2-soft)} .lv3{--c:var(--lv3);--soft:var(--lv3-soft)}
.grow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 14px;text-align:left;cursor:pointer}
.grow:active{background:var(--soft)}
.gnum{font-family:var(--font-word);font-weight:700;font-size:20px;color:var(--c);font-variant-numeric:tabular-nums}
.gpre{min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gpre b{color:var(--ink);font-weight:500;font-family:var(--font-word);font-size:14px}
.grec{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.mark,.legend b,.rmark,.summary b.m-ex{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.mark{font-size:18px;font-weight:700;width:24px;text-align:center;line-height:1}
.m-ex{color:var(--ok)} .m-go{color:var(--good)} .m-ok{color:var(--warn)} .m-ng{color:var(--bad)} .m-none{color:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend b{font-size:14px;line-height:1}

/* session */
.sess-top{display:flex;align-items:center;gap:8px;padding:10px 12px 0 8px}
.sess-top .prog{flex:1;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.timer{min-width:64px;height:44px;border-radius:12px;background:var(--ai-soft);color:var(--ai);display:grid;place-items:center;font-family:var(--font-word);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.timer.paused{opacity:.45}
.timer.low{background:var(--lv3-soft);color:var(--lv3)}
.pbar{height:4px;margin:10px 16px 0;background:var(--line);border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ai);transition:width .1s linear}
.word-zone{flex:0 0 auto;min-height:34%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:6px;text-align:center}
.word{font-family:var(--font-word);font-weight:700;font-size:clamp(34px,11vw,52px);line-height:1.15;overflow-wrap:anywhere}
.pos{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.mean-zone{flex:1;min-height:0;overflow-y:auto;margin:0 16px 16px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;gap:10px}
.primary-m{font-size:24px;font-weight:700;line-height:1.4}
.primary-m .sep{color:var(--muted);font-weight:400;padding:0 .3em}
.other-m{color:var(--muted);font-size:15px}
.other-m::before{content:"その他の意味";display:block;font-size:11px;letter-spacing:.08em;margin-bottom:2px}
.ready{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.ready .gbig{font-family:var(--font-word);font-size:64px;font-weight:700;line-height:1;color:var(--c)}
.ready p{margin:0;color:var(--muted)}
.ready .btn{max-width:280px}
.answer-box{margin:0 16px;display:flex;gap:8px}
.answer-box input{flex:1;min-width:0;font:inherit;font-size:18px;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.answer-box input:focus{outline:none;border-color:var(--ai)}
.answer-box .btn{width:auto;padding:0 18px;min-width:84px}
.answer-box .btn.next{background:var(--lv1)}
.hint{margin:6px 16px 0;font-size:12px;color:var(--muted)}
.verdict{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--bad)}
.your{font-size:13px;color:var(--muted)}
.vnote{font-size:13px;font-weight:500;color:var(--muted)}
.next-row{margin:0 16px 16px}
.placeholder{color:var(--muted);font-size:14px;margin:auto;text-align:center}

/* result */
.result{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 16px 8px;text-align:center}
.result .frac{font-family:var(--font-word);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.result .frac small{font-size:28px;color:var(--muted)}
.result .score{font-size:20px;font-weight:700}
.result .rmark{font-size:64px;line-height:1.1;font-weight:700}
.miss{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.miss h3{margin:0;padding:10px 14px;font-size:14px;background:var(--bg);border-bottom:1px solid var(--line)}
.miss div{padding:8px 14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.miss div:first-of-type{border-top:0}
.miss b{font-family:var(--font-word);min-width:40%}
.miss span{color:var(--muted);font-size:13px}

/* settings */
.set-block{display:flex;flex-direction:column;gap:10px}
.set-block h3{margin:0;font-size:15px}
.set-block p{margin:0;font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ai);color:var(--surface);border-color:var(--ai);font-weight:700}
.note{font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:10}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const WORDS = JSON.parse(document.getElementById('words').textContent);
const LEVELS = [
  {key:'基礎', cls:'lv1', desc:'高校の最初に習う語'},
  {key:'標準', cls:'lv2', desc:'英検2級・共通テストの中心'},
  {key:'発展', cls:'lv3', desc:'長文で差がつく語・頻出テーマ語'},
];
const SECS = [2,6,8,10,12,14];
const SIZES = [25,50,75,100,150,200];
const LS_KEY = 'tango2kyu.v1';

/* ---------- state & storage ---------- */
let state = {settings:{secs:10,size:25}, records:{}};
try { const s = JSON.parse(localStorage.getItem(LS_KEY)||'null'); if (s && s.settings) state = {settings:{...state.settings,...s.settings}, records:s.records||{}}; } catch(e){}
let dbRef = null, writing = false, pendingWrite = false;

function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
async function saveRemote(){
  if (!dbRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try { await dbRef.set({settings:state.settings, records:state.records, updatedAt:Date.now()}); }
  catch(e){ if (e && e.code==='invalid_argument') dbRef = null; }
  writing = false;
  if (pendingWrite){ pendingWrite = false; saveRemote(); }
}
function save(){ saveLocal(); saveRemote(); }

(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();

    const snap = await dbRef.get();
    if (snap.exists){
      const d = snap.data() || {};
      const rec = {...state.records};
      for (const [k,v] of Object.entries(d.records||{})){ if (!rec[k] || (v.at||0) >= (rec[k].at||0)) rec[k] = v; }
      state = {settings:{...state.settings, ...(d.settings||{})}, records:rec};
      saveLocal();
      if (view.name==='top' || view.name==='list' || view.name==='select') render();
    } else if (Object.keys(state.records).length){ saveRemote(); }
  } catch(e){}
})();

/* ---------- groups ---------- */
function buildGroups(size){
  const out = []; let n = 1;
  for (const lv of LEVELS){
    const ws = WORDS.filter(w => w.lv === lv.key);
    const chunks = [];
    for (let i=0;i<ws.length;i+=size) chunks.push(ws.slice(i,i+size));
    if (chunks.length>1 && chunks[chunks.length-1].length < size/2){ const last = chunks.pop(); chunks[chunks.length-1] = chunks[chunks.length-1].concat(last); }
    const groups = chunks.map(c => ({num:n++, level:lv, words:c}));
    out.push({level:lv, groups});
  }
  return out;
}
let cache = {};
function groupsFor(size){ return cache[size] || (cache[size] = buildGroups(size)); }
function recKey(size,num){ return size + '-' + num; }
function markOf(c,t){ const r=c/t; if (r>=1) return ['◎','m-ex']; if (r>=0.8) return ['◯','m-go']; if (r>=0.5) return ['△','m-ok']; return ['☓','m-ng']; }

/* ---------- answer checking ---------- */
function kataToHira(s){ return s.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0x60)); }
function clean(s){
  s = (s||'').normalize('NFKC').toLowerCase();
  s = s.replace(/\([^)]*\)/g,'');
  s = s.replace(/[\s、。,.・!?！？「」『』～~〜\-―]/g, '');
  return kataToHira(s);
}
function stem(s){
  s = clean(s);
  s = s.replace(/^(を|に|が|と|の|は)/,'');
  const suf = ['することができる','すること','させる','される','する','している','した','して','的な','的に','である','なこと','こと','だ','な','に','の'];
  for (const x of suf){ if (s.length > x.length+1 && s.endsWith(x)){ s = s.slice(0, -x.length); break; } }
  return s;
}
function matchOne(a, v){
  const b = stem(v); if (!b) return false;
  if (a === b) return true;
  if (b.length >= 2 && a.includes(b)) return true;
  if (a.length >= 2 && b.includes(a) && a.length >= Math.ceil(b.length*0.6)) return true;
  return false;
}
function variants(p){ return [p, ...p.split(/[・/]/)].concat((p.match(/\(([^)]*)\)/)||[])[1] && /[^\x00-\x7f]/.test((p.match(/\(([^)]*)\)/)||[])[1]) ? [(p.match(/\(([^)]*)\)/))[1]] : []); }
const KANJI2 = /[\u4e00-\u9fff々]{2}/g;
function kanjiPairs(s){ const out=new Set(); const str=clean(s); for (let i=0;i<str.length-1;i++){ const pr=str.slice(i,i+2); if (/^[\u4e00-\u9fff々]{2}$/.test(pr)) out.add(pr); } return out; }
/* returns 'p' (主な意味), 'o' (その他の意味), 's' (類義語・近い意味) or '' */
function judge(input, w){
  const a = stem(input); if (!a) return '';
  if (w.p.some(p => variants(p).some(v => matchOne(a, v)))) return 'p';
  if (w.o.some(o => variants(o).some(v => matchOne(a, v)))) return 'o';
  if ((w.a||[]).some(s => matchOne(a, s))) return 's';
  const mine = kanjiPairs(input);
  if (mine.size){ for (const m of [...w.p, ...w.o]){ for (const pr of kanjiPairs(m)) if (mine.has(pr)) return 's'; } }
  return '';
}
function isCorrect(input, primaries){ return judge(input, {p:primaries, o:[], a:[]}) !== ''; }

function stats(){
  const {size} = state.settings; const lvs = groupsFor(size);
  let total=0, done=0, ex=0, sum=0, cnt=0;
  const per = lvs.map(L => { let d=0; for (const g of L.groups){ total++; const r = state.records[recKey(size,g.num)]; if (r){ done++; d++; sum+=r.c/r.t; cnt++; if (r.c===r.t) ex++; } } return {level:L.level, n:L.groups.length, d}; });
  return {total, done, ex, avg: cnt ? Math.round(sum/cnt*100) : null, per};
}
function nextCard(){

/* ---------- timer ---------- */
function startCountdown(onTick, onEnd){
  stopTimer();
  const total = state.settings.secs*1000; const t0 = performance.now();
  const tick = () => {
    const left = Math.max(0, total - (performance.now()-t0));
    onTick(left, total);
    if (left <= 0){ stopTimer(); onEnd(); }
  };
  tick(); timerId = setInterval(tick, 100);
}
function paintTimer(left,total){
  const el = document.getElementById('timer'), pb = document.getElementById('pbar');
  if (!el) return;
  const sec = Math.ceil(left/1000);
  el.textContent = sec; el.classList.toggle('low', sec<=3);
  if (pb) pb.style.width = (left/total*100)+'%';
}
function meaningHTML(w){
  return `<div class="primary-m">${w.p.map(esc).join('<span class="sep">／</span>')}</div>${w.o.length?`<div class="other-m">${w.o.map(esc).join('、')}</div>`:''}`;
}

    const val = input.value.trim(); if (!val) return;
    stopTimer();
    reveal(judge(val, w), val);
    const tm = document.getElementById('timer'); if (tm) tm.classList.add('paused');
  };
  startCountdown(paintTimer, () => {
    if (!view.answered){ reveal('', ''); setTimeout(() => { if (view.token===token) nextChal(); }, 4000); }
    else nextChal();
  });
}
function reveal(kind, val){
  const ok = !!kind;
  const w = view.words[view.i];
  view.answered = true;
  view.results.push({w, ok, val});
  const mz = document.getElementById('mz');
  mz.innerHTML = `<div class="verdict ${ok?'ok':'ng'}">${ok?'◯ 正解':'✕ 不正解'}${kind==='o'?'<span class="vnote">（ほかの訳）</span>':kind==='s'?'<span class="vnote">（近い意味の言葉）</span>':''}</div>${val?`<div class="your">あなたの答え：${esc(val)}</div>`:'<div class="your">時間切れ</div>'}${meaningHTML(w)}`;
  const sub = document.getElementById('sub'); if (sub){ sub.textContent = '次へ'; sub.classList.add('next'); }
  const prog = app.querySelector('.prog'); if (prog) prog.textContent = `グループ${view.num} ・ ${view.i+1} / ${view.words.length} ・ 正解 ${view.results.filter(r=>r.ok).length}`;
}
function nextChal(){
  if (view.name!=='chal') return;
  stopTimer();
  if (view.i+1 < view.words.length){ view.i++; renderChal(); }
  else finishChal();
}
function finishChal(){
  keepAwake(false);
  const c = view.results.filter(r=>r.ok).length, t = view.words.length;
  state.records[recKey(state.settings.size, view.num)] = {c, t, at:Date.now()};
  save();
  go({name:'result', num:view.num, c, t, results:view.results});
}

/* ---------- result ---------- */
function renderResult(){
  const {c,t,num,results} = view; const m = markOf(c,t); const score = Math.round(c/t*100);
  const miss = results.filter(r=>!r.ok);
  app.innerHTML = `
  <section class="screen">
    <div class="scroll">
      <div class="result">
        <span class="eyebrow">グループ${num} の結果</span>
        <div class="rmark ${m[1]}">${m[0]}</div>
        <div class="frac">${c}<small> / ${t}</small></div>
        <div class="score">${score}点 <span style="font-weight:400;color:var(--muted);font-size:14px">/ 100点</span></div>
      </div>
      <button class="btn primary" id="home">トップに戻る</button>
      <button class="btn ghost" id="retry">もう一度挑戦する</button>
      ${miss.length ? `<div class="miss"><h3>まちがえた単語（${miss.length}）</h3>${miss.map(r=>`<div><b>${esc(r.w.w)}</b><span>${r.w.p.map(esc).join('／')}</span></div>`).join('')}</div>` : `<p class="note" style="text-align:center">全問正解です。一覧のこのグループに◎がつきました。</p>`}
    </div>
  </section>`;
  document.getElementById('home').onclick = () => go({name:'top'});
  document.getElementById('retry').onclick = () => go({name:'ready', mode:'chal', num});
}

document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible' && (view.name==='learn'||view.name==='chal')) keepAwake(true); });
window.__test = {isCorrect, buildGroups};
render();
})();
</script>
